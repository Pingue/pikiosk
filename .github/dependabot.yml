version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/central", "/localmanager"]
    schedule:
      interval: "weekly"
    assignees: ["Pingue"]
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/central"
    schedule:
      interval: "weekly"
    assignees: ["Pingue"]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["Pingue"]
    groups:
      actions:
        patterns: ["*"]
